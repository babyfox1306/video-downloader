<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải video online - ZavClip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="description" content="Tải video từ YouTube, Vimeo, Twitter và nhiều nền tảng khác.">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-purple-800 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <nav class="flex justify-between items-center">
                <a href="/index.html" class="flex items-center space-x-2">
                    <i class="fas fa-toolbox text-2xl"></i>
                    <h1 class="text-2xl font-bold">ZavClip</h1>
                </a>
                <div class="flex space-x-6">
                    <a href="/index.html" class="hover:underline">Trang chủ</a>
                    <a href="/tools.html" class="hover:underline">Tất cả công cụ</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold mb-4 flex items-center">
                <i class="fas fa-download text-indigo-600 mr-3"></i>
                Tải video online
            </h1>
            <p class="text-gray-600 mb-6">Tải video từ nhiều nền tảng phổ biến</p>

            <div class="mb-6">
                <label for="videoUrl" class="block text-sm font-bold mb-2">Link video</label>
                <input type="text" id="videoUrl" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-600"
                       placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <button onclick="downloadVideo()" 
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 mb-4">
                <i class="fas fa-download mr-2"></i>Tải video
            </button>

            <div id="result" class="mt-6"></div>
            <div id="loading" class="hidden text-center py-8">
                <i class="fas fa-spinner fa-spin text-4xl text-indigo-600"></i>
                <p class="mt-4 text-gray-600">Đang xử lý...</p>
            </div>
        </div>

        <!-- Supported Platforms -->
        <div class="bg-gray-50 rounded-lg p-6 mt-6">
            <h3 class="font-bold mb-4">Nền tảng hỗ trợ:</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="text-center p-3 bg-white rounded-lg shadow">
                    <i class="fab fa-youtube text-3xl text-red-600 mb-2"></i>
                    <p class="text-sm font-semibold">YouTube</p>
                </div>
                <div class="text-center p-3 bg-white rounded-lg shadow">
                    <i class="fab fa-vimeo text-3xl text-blue-600 mb-2"></i>
                    <p class="text-sm font-semibold">Vimeo</p>
                </div>
                <div class="text-center p-3 bg-white rounded-lg shadow">
                    <i class="fab fa-twitter text-3xl text-sky-600 mb-2"></i>
                    <p class="text-sm font-semibold">Twitter</p>
                </div>
                <div class="text-center p-3 bg-white rounded-lg shadow">
                    <i class="fab fa-instagram text-3xl text-pink-600 mb-2"></i>
                    <p class="text-sm font-semibold">Instagram</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // BACKEND API URL - Change this to your backend URL
        // Example: const BACKEND_API = 'https://your-backend.onrender.com/api/video';
        const BACKEND_API = 'https://video-downloader-38i3.onrender.com/api/video';
        
        async function downloadVideo() {
            const url = document.getElementById('videoUrl').value;
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');

            if (!url.trim()) {
                resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Vui lòng nhập link video!</div>';
                return;
            }

            loading.classList.remove('hidden');
            resultDiv.innerHTML = '';

            try {
                const response = await fetch(BACKEND_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url })
                });

                if (response.ok) {
                    // Check if response is a file download
                    const contentType = response.headers.get('content-type');
                    
                    if (contentType && contentType.includes('video')) {
                        // Direct download
                        const blob = await response.blob();
                        const downloadUrl = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = 'video.mp4';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(downloadUrl);
                        
                        resultDiv.innerHTML = `
                            <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                                <i class="fas fa-check-circle mr-2"></i>
                                Đã tải thành công! File đang được tải về...
                            </div>
                        `;
                    } else {
                        // JSON response with file URL
                        const data = await response.json();
                        if (data.success && data.file_url) {
                            resultDiv.innerHTML = `
                                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
                                    <i class="fas fa-check-circle mr-2"></i>
                                    ${data.message || 'Tải video thành công!'}
                                </div>
                                <div class="bg-gray-50 rounded-lg p-4">
                                    <a href="${data.file_url}" target="_blank" 
                                       class="inline-block w-full text-center bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700">
                                        <i class="fas fa-download mr-2"></i>Tải video về máy
                                    </a>
                                </div>
                            `;
                        } else {
                            throw new Error(data.message || 'Không thể tải video');
                        }
                    }
                } else {
                    const error = await response.json();
                    throw new Error(error.error || 'Không thể tải video');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <strong>Lỗi:</strong> ${error.message}
                        <br><br>
                        <small>Backend URL: ${BACKEND_API}</small>
                    </div>
                `;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
