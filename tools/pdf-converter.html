<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi PDF - ZavClip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="description" content="Chuyển đổi file sang PDF miễn phí. Word, Excel, JPG to PDF online.">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-purple-800 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <nav class="flex justify-between items-center">
                <a href="/index.html" class="flex items-center space-x-2">
                    <i class="fas fa-toolbox text-2xl"></i>
                    <h1 class="text-2xl font-bold">ZavClip</h1>
                </a>
                <div class="flex space-x-6">
                    <a href="/index.html" class="hover:underline">Trang chủ</a>
                    <a href="/tools.html" class="hover:underline">Tất cả công cụ</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold mb-4 flex items-center">
                <i class="fas fa-file-pdf text-blue-600 mr-3"></i>
                Chuyển đổi PDF
            </h1>
            <p class="text-gray-600 mb-6">Chuyển đổi ảnh sang PDF miễn phí, không watermark</p>

            <div class="mb-6">
                <label for="fileInput" class="block text-sm font-bold mb-2">Chọn file để chuyển đổi</label>
                <input type="file" id="fileInput" accept="image/*,.doc,.docx,.txt" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4">
                <p class="text-sm text-gray-600">Hỗ trợ: JPG, PNG, Word, TXT</p>
            </div>

            <button onclick="convertToPDF()" 
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 mb-4">
                <i class="fas fa-file-pdf mr-2"></i>Chuyển đổi sang PDF
            </button>

            <div id="result" class="mt-6"></div>
            <div id="loading" class="hidden text-center py-8">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
                <p class="mt-4 text-gray-600">Đang xử lý...</p>
            </div>
        </div>

        <!-- Supported Formats -->
        <div class="bg-blue-50 rounded-lg p-6 mt-6">
            <h3 class="font-bold mb-3">📄 Định dạng hỗ trợ:</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                <div class="text-center">
                    <i class="fas fa-file-image text-3xl text-green-600 mb-2"></i><br>
                    <strong>JPG → PDF</strong>
                </div>
                <div class="text-center">
                    <i class="fas fa-file-image text-3xl text-purple-600 mb-2"></i><br>
                    <strong>PNG → PDF</strong>
                </div>
                <div class="text-center">
                    <i class="fas fa-file-word text-3xl text-blue-600 mb-2"></i><br>
                    <strong>Word → PDF</strong>
                </div>
                <div class="text-center">
                    <i class="fas fa-file-alt text-3xl text-gray-600 mb-2"></i><br>
                    <strong>TXT → PDF</strong>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        async function convertToPDF() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            if (!file) {
                alert('Vui lòng chọn file!');
                return;
            }

            loading.classList.remove('hidden');
            result.innerHTML = '';

            try {
                const isImage = file.type.startsWith('image/');
                
                if (isImage) {
                    // Convert image to PDF
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            const pdf = new jsPDF.jsPDF({
                                orientation: img.width > img.height ? 'landscape' : 'portrait',
                                unit: 'px',
                                format: [img.width, img.height]
                            });

                            pdf.addImage(event.target.result, 'JPG', 0, 0, img.width, img.height);
                            const pdfBlob = pdf.output('blob');
                            downloadPDF(pdfBlob, file.name);
                            
                            result.innerHTML = `
                                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                                    <i class="fas fa-check-circle mr-2"></i>
                                    Chuyển đổi thành công!
                                </div>
                            `;
                            loading.classList.add('hidden');
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                } else {
                    // For text files (simple implementation)
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const pdf = new jsPDF.jsPDF();
                        const text = event.target.result;
                        pdf.text(text, 10, 10);
                        const pdfBlob = pdf.output('blob');
                        downloadPDF(pdfBlob, file.name);
                        
                        result.innerHTML = `
                            <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                                <i class="fas fa-check-circle mr-2"></i>
                                Chuyển đổi thành công!
                            </div>
                        `;
                        loading.classList.add('hidden');
                    };
                    reader.readAsText(file);
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        Lỗi: ${error.message}
                    </div>
                `;
                loading.classList.add('hidden');
            }
        }

        function downloadPDF(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename.replace(/\.[^/.]+$/, '') + '.pdf';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
