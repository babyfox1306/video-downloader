<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 - ZavClip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="description" content="Chuyển đổi video YouTube sang MP3 miễn phí. Tải nhạc từ YouTube chất lượng cao.">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-purple-800 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <nav class="flex justify-between items-center">
                <a href="/index.html" class="flex items-center space-x-2">
                    <i class="fas fa-toolbox text-2xl"></i>
                    <h1 class="text-2xl font-bold">ZavClip</h1>
                </a>
                <div class="flex space-x-6">
                    <a href="/index.html" class="hover:underline">Trang chủ</a>
                    <a href="/tools.html" class="hover:underline">Tất cả công cụ</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold mb-4 flex items-center">
                <i class="fab fa-youtube text-red-600 mr-3"></i>
                YouTube to MP3
            </h1>
            <p class="text-gray-600 mb-6">Chuyển đổi video YouTube sang file MP3 miễn phí</p>

            <div class="mb-6">
                <label for="youtubeUrl" class="block text-sm font-bold mb-2">Link video YouTube</label>
                <input type="text" id="youtubeUrl" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600"
                       placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <button onclick="downloadMP3()" 
                    class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 mb-4">
                <i class="fas fa-music mr-2"></i>Chuyển đổi sang MP3
            </button>

            <div id="result" class="mt-6"></div>
            <div id="loading" class="hidden text-center py-8">
                <i class="fas fa-spinner fa-spin text-4xl text-red-600"></i>
                <p class="mt-4 text-gray-600">Đang xử lý...</p>
            </div>
        </div>

        <!-- Info -->
        <div class="bg-blue-50 rounded-lg p-6 mt-6">
            <h3 class="font-bold mb-3 flex items-center">
                <i class="fas fa-info-circle text-blue-600 mr-2"></i>
                Lưu ý
            </h3>
            <ul class="list-disc list-inside space-y-2 text-sm text-gray-700">
                <li>Chỉ tải video được phép tải xuống</li>
                <li>Không hỗ trợ video có bản quyền nghiêm ngặt</li>
                <li>Chất lượng âm thanh phụ thuộc vào chất lượng video gốc</li>
            </ul>
        </div>
    </div>

    <script>
        async function downloadMP3() {
            const url = document.getElementById('youtubeUrl').value;
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');

            if (!url.trim()) {
                resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Vui lòng nhập link YouTube!</div>';
                return;
            }

            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Link không hợp lệ!</div>';
                return;
            }

            loading.classList.remove('hidden');
            resultDiv.innerHTML = '';

            try {
                // Using ytmp3.cc API (free alternative)
                const apiUrl = `https://youtube-mp3-download1.p.rapidapi.com/dl?id=${extractVideoId(url)}`;
                
                // Alternative: Using savefrom.net API
                const saveFromUrl = `https://co.wukker.net/api/json?url=${encodeURIComponent(url)}`;
                const response = await fetch(saveFromUrl);
                const data = await response.json();

                if (data.title) {
                    const downloadLink = data.url;
                    resultDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
                            Thành công! Video: "${data.title}"
                        </div>
                        <div class="bg-gray-50 rounded-lg p-6">
                            <a href="${downloadLink}" download 
                               class="inline-block w-full text-center bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700">
                                <i class="fas fa-download mr-2"></i>Tải MP3
                            </a>
                        </div>
                    `;
                } else {
                    throw new Error('Không thể tải video');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded">
                        <strong>Lưu ý:</strong> Chức năng này cần API backend. Vui lòng sử dụng API có sẵn hoặc deploy backend.
                        <br><br>
                        <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" class="text-blue-600 underline">
                            Xem hướng dẫn tích hợp yt-dlp
                        </a>
                    </div>
                `;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }
    </script>
</body>
</html>
