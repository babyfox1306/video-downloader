<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo QR Code miễn phí - ZavClip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-purple-800 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <nav class="flex justify-between items-center">
                <a href="/index.html" class="flex items-center space-x-2">
                    <i class="fas fa-toolbox text-2xl"></i>
                    <h1 class="text-2xl font-bold">ZavClip</h1>
                </a>
                <div class="flex space-x-6">
                    <a href="/index.html" class="hover:underline">Trang chủ</a>
                    <a href="/tools.html" class="hover:underline">Tất cả công cụ</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold mb-4 flex items-center">
                <i class="fas fa-qrcode text-green-600 mr-3"></i>
                Tạo QR Code miễn phí
            </h1>
            <p class="text-gray-600 mb-6">Nhập nội dung và tạo mã QR trong vài giây</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Input Section -->
                <div>
                    <label for="qrText" class="block text-sm font-bold mb-2">Nội dung QR Code</label>
                    <textarea id="qrText" rows="6" 
                              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600 mb-4"
                              placeholder="Nhập URL, text, số điện thoại, wifi...">https://example.com</textarea>
                    
                    <div class="mb-4">
                        <label for="qrSize" class="block text-sm font-bold mb-2">Kích thước</label>
                        <select id="qrSize" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600">
                            <option value="200">Nhỏ (200px)</option>
                            <option value="300" selected>Trung bình (300px)</option>
                            <option value="400">Lớn (400px)</option>
                        </select>
                    </div>

                    <button onclick="generateQR()" 
                            class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700">
                        <i class="fas fa-qrcode mr-2"></i>Tạo QR Code
                    </button>

                    <button onclick="downloadQR()" id="downloadBtn" 
                            class="w-full mt-3 bg-gray-600 text-white py-3 rounded-lg font-semibold hover:bg-gray-700 hidden">
                        <i class="fas fa-download mr-2"></i>Tải xuống
                    </button>
                </div>

                <!-- QR Output -->
                <div class="flex flex-col items-center justify-center">
                    <div id="qrcode" class="border-2 border-gray-300 rounded-lg p-4 mb-4 min-h-[200px] flex items-center justify-center">
                        <p class="text-gray-400">QR Code sẽ hiển thị tại đây</p>
                    </div>
                    <canvas id="qrCanvas" class="hidden"></canvas>
                </div>
            </div>

            <!-- Examples -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <h3 class="text-lg font-bold mb-3">Ví dụ:</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="setExample('URL', 'https://google.com')" 
                            class="text-left p-3 border border-gray-300 rounded-lg hover:bg-green-50">
                        <i class="fas fa-link text-blue-600 mb-2"></i><br>
                        <strong>URL</strong><br>
                        <span class="text-sm text-gray-600">Liên kết website</span>
                    </button>
                    <button onclick="setExample('Text', 'Hello World')" 
                            class="text-left p-3 border border-gray-300 rounded-lg hover:bg-green-50">
                        <i class="fas fa-font text-purple-600 mb-2"></i><br>
                        <strong>Text</strong><br>
                        <span class="text-sm text-gray-600">Văn bản</span>
                    </button>
                    <button onclick="setExample('Wifi', 'WIFI:T:WPA;S:MyNetwork;P:mypassword;;')" 
                            class="text-left p-3 border border-gray-300 rounded-lg hover:bg-green-50">
                        <i class="fas fa-wifi text-orange-600 mb-2"></i><br>
                        <strong>WiFi</strong><br>
                        <span class="text-sm text-gray-600">Mật khẩu WiFi</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let qrcode = null;

        function generateQR() {
            const text = document.getElementById('qrText').value;
            const size = document.getElementById('qrSize').value;
            
            if (!text.trim()) {
                alert('Vui lòng nhập nội dung!');
                return;
            }

            document.getElementById('qrcode').innerHTML = '';
            
            qrcode = new QRCode(document.getElementById("qrcode"), {
                text: text,
                width: parseInt(size),
                height: parseInt(size),
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('downloadBtn').classList.remove('hidden');
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('Vui lòng tạo QR Code trước!');
                return;
            }

            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function setExample(type, value) {
            document.getElementById('qrText').value = value;
            generateQR();
        }
    </script>
</body>
</html>
