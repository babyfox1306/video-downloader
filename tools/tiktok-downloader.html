<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải video TikTok miễn phí - ZavClip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="description" content="Tải video TikTok không logo, chất lượng HD. Free TikTok video downloader.">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-purple-800 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <nav class="flex justify-between items-center">
                <a href="/index.html" class="flex items-center space-x-2">
                    <i class="fas fa-toolbox text-2xl"></i>
                    <h1 class="text-2xl font-bold">ZavClip</h1>
                </a>
                <div class="flex space-x-6">
                    <a href="/index.html" class="hover:underline">Trang chủ</a>
                    <a href="/tools.html" class="hover:underline">Tất cả công cụ</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold mb-4 flex items-center">
                <i class="fab fa-tiktok text-pink-600 mr-3"></i>
                Tải video TikTok
            </h1>
            <p class="text-gray-600 mb-6">Nhập link video TikTok để tải về máy miễn phí</p>

            <div class="mb-6">
                <label for="tiktokUrl" class="block text-sm font-bold mb-2">Link video TikTok</label>
                <input type="text" id="tiktokUrl" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-pink-600"
                       placeholder="https://www.tiktok.com/@username/video/1234567890">
            </div>

            <button onclick="downloadTikTok()" 
                    class="w-full bg-pink-600 text-white py-3 rounded-lg font-semibold hover:bg-pink-700 mb-4">
                <i class="fab fa-tiktok mr-2"></i>Tải video
            </button>

            <div id="result" class="mt-6"></div>
            <div id="loading" class="hidden text-center py-8">
                <i class="fas fa-spinner fa-spin text-4xl text-pink-600"></i>
                <p class="mt-4 text-gray-600">Đang xử lý...</p>
            </div>
        </div>

        <!-- Instructions -->
        <div class="bg-blue-50 rounded-lg p-6 mt-6">
            <h3 class="font-bold mb-3 flex items-center">
                <i class="fas fa-info-circle text-blue-600 mr-2"></i>
                Hướng dẫn
            </h3>
            <ol class="list-decimal list-inside space-y-2 text-sm text-gray-700">
                <li>Mở ứng dụng TikTok trên điện thoại</li>
                <li>Tìm video muốn tải</li>
                <li>Nhấn nút chia sẻ → Sao chép liên kết</li>
                <li>Dán link vào ô trên và nhấn "Tải video"</li>
            </ol>
        </div>
    </div>

    <script>
        async function downloadTikTok() {
            const url = document.getElementById('tiktokUrl').value;
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');

            if (!url.trim()) {
                resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Vui lòng nhập link TikTok!</div>';
                return;
            }

            if (!url.includes('tiktok.com')) {
                resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Link không hợp lệ! Vui lòng nhập link TikTok.</div>';
                return;
            }

            loading.classList.remove('hidden');
            resultDiv.innerHTML = '';

            try {
                // Using tikwm.com API (free alternative)
                const apiUrl = `https://tikwm.com/api/?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.code === 0 && data.data) {
                    const video = data.data;
                    const downloadUrl = video.play;
                    const cover = video.cover;

                    resultDiv.innerHTML = `
                        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
                            Tải thành công!
                        </div>
                        <div class="bg-gray-50 rounded-lg p-6">
                            <img src="${cover}" alt="Video cover" class="w-full rounded mb-4">
                            <a href="${downloadUrl}" download 
                               class="inline-block w-full text-center bg-pink-600 text-white py-3 rounded-lg font-semibold hover:bg-pink-700">
                                <i class="fas fa-download mr-2"></i>Tải video về máy
                            </a>
                        </div>
                    `;
                } else {
                    throw new Error('Không thể tải video');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                        Lỗi: Không thể tải video. Vui lòng thử lại!
                    </div>
                `;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
