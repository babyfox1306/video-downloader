<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - ZavClip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-600 to-purple-800 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <nav class="flex justify-between items-center">
                <a href="index.html" class="flex items-center space-x-2">
                    <i class="fas fa-toolbox text-2xl"></i>
                    <h1 class="text-2xl font-bold">ZavClip</h1>
                </a>
                <div class="flex space-x-6">
                    <a href="index.html" class="hover:underline">Trang chủ</a>
                    <a href="tools.html" class="hover:underline">Tất cả công cụ</a>
                    <a href="about.html" class="hover:underline">Về chúng tôi</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 max-w-2xl">
        <h1 class="text-4xl font-bold mb-8 text-center">Liên hệ với chúng tôi</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-8">
            <form id="contactForm" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-bold mb-2">Tên của bạn</label>
                    <input type="text" id="name" name="name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
                </div>

                <div>
                    <label for="email" class="block text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" name="email" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
                </div>

                <div>
                    <label for="subject" class="block text-sm font-bold mb-2">Chủ đề</label>
                    <input type="text" id="subject" name="subject" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
                </div>

                <div>
                    <label for="message" class="block text-sm font-bold mb-2">Nội dung</label>
                    <textarea id="message" name="message" rows="5" required 
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600"></textarea>
                </div>

                <button type="submit" 
                        class="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 transition">
                    Gửi tin nhắn <i class="fas fa-paper-plane ml-2"></i>
                </button>
            </form>

            <div id="successMessage" class="hidden mt-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
                <i class="fas fa-check-circle mr-2"></i>Cảm ơn bạn! Tin nhắn đã được gửi thành công.
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-12 mt-16">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 ZavClip. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simulate form submission
            document.getElementById('successMessage').classList.remove('hidden');
            this.reset();
        });
    </script>
</body>
</html>
