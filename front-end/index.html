<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Downloader</h1>
            <p>Easily download videos from Pinterest, YouTube, TikTok, and Vimeo!</p>
        </header>
        <main>
            <div class="input-container">
                <input type="text" id="video-url" placeholder="Enter video link here…">
                <button id="download-btn">Download</button>
            </div>
            <div id="loader" style="display: none;">Loading...</div>
            <div id="progress-container" style="display: none;">
                <label for="progress">Downloading...</label>
                <progress id="progress" value="0" max="100"></progress>
            </div>
            <div id="message"></div>
            <div id="download-container" style="display: none;">
                <p id="file-name"></p>
                <a id="download-link" href="#" download>Download File</a>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Video Downloader</p>
        </footer>
    </div>

    <script>
        document.getElementById("download-btn").addEventListener("click", function () {
            const url = document.getElementById("video-url").value;
            const loader = document.getElementById("loader");
            const message = document.getElementById("message");
            const progressBar = document.getElementById("progress");
            const progressContainer = document.getElementById("progress-container");
            const downloadContainer = document.getElementById("download-container");
            const fileNameElement = document.getElementById("file-name");
            const downloadLink = document.getElementById("download-link");

            // Reset UI
            loader.style.display = "none";
            message.innerHTML = "";
            downloadContainer.style.display = "none";
            progressContainer.style.display = "block";
            progressBar.value = 0;

            // Validate URL
            if (!url) {
                progressContainer.style.display = "none";
                message.innerHTML = "Please enter a valid video URL!";
                message.style.color = "red";
                return;
            }

            // Create XMLHttpRequest to track progress
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "https://video-downloader-38i3.onrender.com/api/video", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            // Track upload progress
            xhr.upload.onprogress = function (event) {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    progressBar.value = percentComplete;
                }
            };

            // Handle response
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    progressContainer.style.display = "none";

                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        message.innerHTML = "Download ready!";
                        message.style.color = "green";

                        const encodedFileName = encodeURIComponent(response.file_name);
                        fileNameElement.innerHTML = `File: ${response.file_name}`;
                        downloadLink.href = `https://video-downloader-38i3.onrender.com/api/download/${encodedFileName}`;
                        downloadContainer.style.display = "block";

                        // Auto download the file
                        const link = document.createElement("a");
                        link.href = downloadLink.href;
                        link.download = response.file_name;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    } else {
                        const errorResponse = JSON.parse(xhr.responseText);
                        message.innerHTML = `Error: ${errorResponse.error || "Failed to download video."}`;
                        message.style.color = "red";
                    }
                }
            };

            // Send request with video URL
            xhr.send(JSON.stringify({ url: url }));
        });
    </script>
</body>
</html>
