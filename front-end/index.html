<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Downloader</h1>
            <p>Download videos from Pinterest, YouTube, TikTok, and more!</p>
        </header>
        <main>
            <div class="input-container">
                <input type="text" id="video-url" placeholder="Enter video URL">
                <button id="download-btn">Download</button>
            </div>
            <div class="logos">
                <img src="pinterest-logo.png" alt="Pinterest" title="Pinterest">
                <img src="youtube-logo.png" alt="YouTube" title="YouTube">
                <img src="tiktok-logo.png" alt="TikTok" title="TikTok">
                <img src="vimeo-logo.png" alt="Vimeo" title="Vimeo">
            </div>
            <div id="loader" style="display: none;">Loading...</div>
            <div id="message"></div>
            <div id="download-container" style="display: none;">
                <p id="file-name"></p>
                <a id="download-link" href="#" download>Download File</a>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Video Downloader</p>
        </footer>
    </div>

    <script>
        document.getElementById("download-btn").addEventListener("click", function() {
            const url = document.getElementById("video-url").value.trim();
            const loader = document.getElementById("loader");
            const message = document.getElementById("message");
            const downloadContainer = document.getElementById("download-container");
            const fileNameElement = document.getElementById("file-name");
            const downloadLink = document.getElementById("download-link");

            // Reset trạng thái
            loader.style.display = "block";
            message.innerHTML = "";
            downloadContainer.style.display = "none";

            if (!url) {
                loader.style.display = "none";
                message.innerHTML = "Please enter a valid video URL!";
                message.style.color = "red";
                return;
            }

            fetch("https://video-downloader-38i3.onrender.com/api/video", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ url: url })
            })
            .then(response => {
                loader.style.display = "none";
                return response.json();
            })
            .then(data => {
                if (data.file_name && data.file_path) {
                    message.innerHTML = "Download ready!";
                    message.style.color = "green";
                    fileNameElement.innerHTML = `File: ${data.file_name}`;
                    downloadLink.href = `https://video-downloader-38i3.onrender.com/api/download/${data.file_name}`;
                    downloadContainer.style.display = "block";
                } else {
                    throw new Error(data.error || "Failed to process the video.");
                }
            })
            .catch(error => {
                loader.style.display = "none";
                message.innerHTML = `Error: ${error.message}`;
                message.style.color = "red";
            });
        });
    </script>
</body>
</html>
