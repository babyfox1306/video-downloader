<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Downloader</h1>
            <p>Easily download videos from Pinterest, YouTube, TikTok, and Vimeo!</p>
        </header>
        <main>
            <div class="input-container">
                <input type="text" id="video-url" placeholder="Enter video link here…">
                <button id="download-btn">Download</button>
            </div>
            <div id="loader" style="display: none;">Loading...</div>
            <div id="message"></div>
            <div id="download-container" style="display: none;">
                <p id="file-name"></p>
                <a id="download-link" href="#" download>Download File</a>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Video Downloader</p>
        </footer>
    </div>

    <script>
        document.getElementById("download-btn").addEventListener("click", function () {
            const url = document.getElementById("video-url").value;
            const loader = document.getElementById("loader");
            const message = document.getElementById("message");
            const downloadContainer = document.getElementById("download-container");
            const fileNameElement = document.getElementById("file-name");
            const downloadLink = document.getElementById("download-link");

            // Reset UI
            loader.style.display = "none";
            message.innerHTML = "";
            downloadContainer.style.display = "none";

            // Validate URL
            if (!url) {
                message.innerHTML = "Please enter a valid video URL!";
                message.style.color = "red";
                return;
            }

            // Show loading spinner
            loader.style.display = "block";

            // Call backend to download video
            fetch("https://video-downloader-38i3.onrender.com/api/video", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: url })
            })
            .then(response => response.json())
            .then(data => {
                loader.style.display = "none";

                if (data.file_name && data.file_path) {
                    // Show download information
                    message.innerHTML = "Download ready!";
                    message.style.color = "green";

                    const encodedFileName = encodeURIComponent(data.file_name); // Encode filename
                    fileNameElement.innerHTML = `File: ${data.file_name}`;
                    downloadLink.href = `https://video-downloader-38i3.onrender.com/api/download/${encodedFileName}`;
                    downloadContainer.style.display = "block";
                } else {
                    throw new Error(data.error || "Failed to process the video.");
                }
            })
            .catch(error => {
                loader.style.display = "none";
                message.innerHTML = `Error: ${error.message}`;
                message.style.color = "red";
            });
        });
    </script>
</body>
</html>
