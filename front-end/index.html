<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Easily download videos from Pinterest, YouTube, TikTok, Vimeo, and more! Fast, simple, and free video downloader.">
    <meta name="keywords" content="video downloader, pinterest video, youtube video, tiktok video, vimeo downloader, download video online">
    <meta name="author" content="Your Name or Your Company">
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Free Video Downloader - Pinterest, YouTube, TikTok, Vimeo">
    <meta property="og:description" content="Download videos from Pinterest, YouTube, TikTok, Vimeo, and more easily.">
    <meta property="og:image" content="your-image-url.jpg">
    <meta property="og:url" content="https://your-website.com">
    <meta name="robots" content="index, follow">
    <title>Video Downloader - Download Pinterest, YouTube, TikTok, Vimeo Videos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Downloader</h1>
            <p>Download videos from Pinterest, YouTube, TikTok, Vimeo, and more, with ease!</p>
        </header>

        <main>
            <section class="input-section">
                <h2>Enter the video URL</h2>
                <input type="text" id="video-url" placeholder="Enter video link here…" aria-label="Enter video URL to download">
                <button id="download-btn" aria-label="Click to download video">Download</button>
            </section>

            <section id="loading-section" class="loader-section" style="display: none;" aria-live="polite">
                <div id="loader" class="loader" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </section>

            <section id="progress-container" style="display: none;">
                <label for="progress">Downloading...</label>
                <progress id="progress" value="0" max="100"></progress>
            </section>

            <section id="message-section" class="message-section">
                <p id="message"></p>
            </section>

            <section id="download-section" class="download-section" style="display: none;">
                <h3>Download Ready!</h3>
                <p id="file-name"></p>
                <a id="download-link" href="#" download>Download File</a>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Video Downloader. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
