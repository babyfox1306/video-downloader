<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Downloader</h1>
            <p>Easily download videos from Pinterest, YouTube, TikTok, and Vimeo!</p>
        </header>
        <main>
            <div class="input-container">
                <input type="text" id="video-url" placeholder="Enter video link here…">
                <button id="download-btn">Download</button>
            </div>
            <div class="logos">
                <img src="pinterest-logo.png" alt="Pinterest" title="Pinterest">
                <img src="youtube-logo.png" alt="YouTube" title="YouTube">
                <img src="tiktok-logo.png" alt="TikTok" title="TikTok">
                <img src="vimeo-logo.png" alt="Vimeo" title="Vimeo">
            </div>
            <div id="loader" style="display: none;">Loading...</div>
            <div id="message"></div>
            <div id="download-container" style="display: none;">
                <button id="download-video-btn">Download Video</button>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Video Downloader | <a href="mailto:support@videodownloader.com">Contact us</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
